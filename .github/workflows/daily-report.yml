name: Daily ETF Flow Signal Report

on:
  schedule:
    # 8:15 UTC = 9:15am Europe/Dublin while IST (UTC+1) is in effect.
    # Shifts to 9:15am UTC = 10:15am Dublin after DST ends in late October
    # unless this is updated to '15 9 * * *' at that point.
    # Note: GitHub gives no SLA on `schedule` triggers -- under load it can
    # fire 1-2+ hours late (observed: fired ~10:00-10:11 UTC on 2026-07-25/26
    # against an 08:15 target). That jitter is a platform limitation, not
    # something fixable from inside the workflow.
    - cron: '15 8 * * *'
  workflow_dispatch: {}

concurrency:
  # A schedule fire that's running very late could still be in flight when
  # the next day's fire lands; without this a late run's stale-by-then
  # report could land in Telegram after (or interleaved with) the next
  # day's, reading like an old copy delivered at a random time.
  group: daily-etf-report
  cancel-in-progress: true

jobs:
  run-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        id: run
        run: |
          set +e
          python etf_flow_signal.py 2>&1 | tee report_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Send report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
            MSG="ETF flow signal run FAILED (exit ${{ steps.run.outputs.exit_code }}):
          $(tail -c 3000 report_output.txt)"
          else
            # Pull just the decision-relevant section (header through the
            # options-market context / divergence note), skipping the
            # detailed cross-correlation / quintile / regime-backtest
            # tables -- those are for deep review, not a daily phone check.
            MSG=$(awk '/ETF FLOW SIGNAL REPORT/,/Cross-correlation \(flow/' report_output.txt | sed '$d')
            FLIP=$(grep "FLIP WATCH" report_output.txt || true)
            if [ -n "$FLIP" ]; then
              MSG="$MSG
          $FLIP"
            fi
            if [ -z "$MSG" ]; then
              # awk range didn't match (report format changed?) -- don't
              # silently send nothing, and don't let it balloon to the
              # whole multi-KB report either.
              MSG="ETF flow signal run succeeded but the report text couldn't be extracted -- check the Actions log for report_output.txt"
            fi
          fi
          # Telegram hard-caps messages at 4096 chars; truncate defensively
          # so an oversized MSG (e.g. the awk fallback above) can't cause a
          # silent rejection instead of a shorter-but-delivered message.
          MSG="${MSG:0:3900}"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MSG")
          echo "Telegram HTTP status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Telegram sendMessage failed (HTTP $HTTP_STATUS) -- see response above"
            exit 1
          fi
